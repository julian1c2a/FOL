name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ⚠️ Escalar de BLOQUE (`run: |`) a propósito. En una sola línea, el `-d:` de `cut`
      # lleva dos puntos seguidos de espacio y YAML lo interpreta como un mapa: «mapping
      # values are not allowed here», y el workflow ni arranca — falla en 0 s con «workflow
      # file issue». Es lo que le pasó al workflow ANTERIOR de este repo: sus dos únicas
      # ejecuciones (mayo de 2026) fallaron en 0 s, y después se borró en «Limpieza».
      - name: Install Lean toolchain
        run: |
          # ⚠️ `tr -d '\r'` NO es decorativo: si `lean-toolchain` llega con CRLF —le pasó
          # a AczelSetTheory, cuyo blob lo tenía— `cut` devuelve «v4.31.0\r» y elan
          # contesta «invalid toolchain name». Medido: su CI murió en 11 s por ese byte.
          elan toolchain install $(cut -d: -f2 lean-toolchain | tr -d '\r')

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      # Los DOS `@[default_target]` del lakefile: `FOL` y `TheoryFramework`. El segundo
      # entró en el build el 2026-09-12 (A-5) precisamente porque, sin él,
      # `TheoryFramework/Instances/FOL.lean` llevaba meses roto sin que nada lo dijera.
      - name: Build
        run: lake build

      # ⛔⛔ CORREGIDO el 2026-09-17. El comentario anterior decía, y con razón aparente:
      #   «`continue-on-error` MEDIDO: hoy `check-sorry.bash` sale con 1 en este árbol.
      #    Cuando el árbol quede a cero, cambiar a `false`.»
      # La salida era cierta; la INFERENCIA, falsa. El árbol YA estaba a cero: lo que salía
      # con 1 era el CONTROL. Contaba `grep -c 'sorry'` a secas, y los dos «sorry» que
      # reportaba eran la frase «100 % sorry-free» dentro de un COMENTARIO
      # (TheoryFramework/Instances/FOL.lean:34 y TheoryFramework/Logic.lean:58).
      # ⇒ se portó el control de ROBINSON_PlusPlus, que despoja comentarios y literales antes
      # de buscar el TOKEN, y entonces da `✅ No sorry found.` con exit 0. MEDIDO.
      # 🔑 Cuando un control da rojo, hay DOS hipótesis — el árbol o el control —, y silenciar
      #    la puerta elige una sin comprobarla. La herramienta se arregla; la cifra nunca.
      - name: Check for sorry
        run: bash check-sorry.bash

      # ⭐ BLOQUEANTE, y medido: hoy sale con 0. Cuenta los `axiom` del árbol, comprueba que
      # AXIOMS.md los cita todos y que ninguna librería retirada ha vuelto al lakefile —
      # que es la enfermedad que dejó un `axiom` FALSO vivo 80 días en una librería
      # declarada y nunca compilada.
      - name: Check axioms
        run: bash check-axioms.bash
