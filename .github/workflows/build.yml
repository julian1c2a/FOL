name: Build

on:
  push:
    # (`ci/**`: la CI antes que master, como en RPP; ADR-167 de RPP)
    branches: [ master, main, 'ci/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: lake build
    # ⛔ 2026-10-04 (ADR-116): FIJADO a ubuntu-24.04. `ubuntu-latest` pasa a Ubuntu 26.04 desde el 2026-10-19
    # (otro mawk, coreutils en Rust), y un verde que no dice contra qué entorno se midió no es reproducible
    # (ADR-073). Los controles se validaron también en 26.04 (WSL); el cambio de imagen se hará a propósito.
    runs-on: ubuntu-24.04
    # ⭐ 2026-10-28 (T41, ADR-202 de RPP): un tope; medido, unos 2 min.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ⚠⚠ Ver ADR-072: [E] compara cada `**Last updated:**` con la fecha del ultimo
          # commit que toco ese fichero, y en un clon SUPERFICIAL `git log -1 -- <f>` devuelve
          # HEAD para todo => el control mediría basura.
          fetch-depth: 0

      # ⭐ 2026-10-28 (R3-4-01 de la ronda 3, ADR-212 de RPP): ningún congelado cambia sin su thaw. El gancho local no
      # bloqueaba nada (las listas en CRLF), y no hay gancho en el servidor: esto es lo que lo vigila de verdad.
      - name: Congelados
        run: bash check-congelados.bash
        env:
          B_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/master' && github.event.before || '') }}

      # (✏️ 2026-10-28, T40: la caché, ANTES de instalar elan y el toolchain, que viven en `~/.elan`.)
      - name: Cache Lake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      # ⭐ 2026-10-28 (T40, ADR-202 de RPP): elan FIJADO (v4.2.4, con su sha256), no el `latest` que baja `elan-init.sh`
      # desde la rama master del instalador.
      - name: Install elan (Lean version manager)
        run: |
          curl -sSfL -o /tmp/elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ⚠️ Escalar de BLOQUE (`run: |`) a propósito. En una sola línea, el `-d:` de `cut`
      # lleva dos puntos seguidos de espacio y YAML lo interpreta como un mapa: «mapping
      # values are not allowed here», y el workflow ni arranca — falla en 0 s con «workflow
      # file issue». Es lo que le pasó al workflow ANTERIOR de este repo: sus dos únicas
      # ejecuciones (mayo de 2026) fallaron en 0 s, y después se borró en «Limpieza».
      - name: Install Lean toolchain
        run: |
          # ⚠️ `tr -d '\r'` NO es decorativo: si `lean-toolchain` llega con CRLF —le pasó
          # a AczelSetTheory, cuyo blob lo tenía— `cut` devuelve «v4.31.0\r» y elan
          # contesta «invalid toolchain name». Medido: su CI murió en 11 s por ese byte.
          elan toolchain install $(cut -d: -f2 lean-toolchain | tr -d '\r')

      # ⭐ 2026-10-28 (T40, ADR-202 de RPP): las versiones de todo lo que mide, en el resumen del run.
      - name: Versiones
        run: |
          {
            echo "### Versiones"
            echo '```'
            echo "imagen: ${ImageOS:-?} ${ImageVersion:-?}"
            elan --version
            lean --version
            lake --version
            echo "awk: $( (awk -W version 2>/dev/null || awk --version) | head -1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Los DOS `@[default_target]` del lakefile: `FOL` y `TheoryFramework`. El segundo
      # entró en el build el 2026-09-12 (A-5) precisamente porque, sin él,
      # `TheoryFramework/Instances/FOL.lean` llevaba meses roto sin que nada lo dijera.
      - name: Build
        run: lake build

      # ⭐ 2026-10-04 (ADR-116, cuarta revisión): `leanchecker` vuelve a pasar cada declaración por el KERNEL
      # (Lean/LeanChecker.lean: «a tool to detect environment hacking»). Sin él, una declaración añadida con
      # `debug.skipKernelTC` o `addDeclWithoutChecking` no la ve ningún censo: no es un `axiom` ni nombra
      # `sorryAx`, y su `#print axioms` sale vacío. Probado con un señuelo así en TheoryFramework: rojo.
      # Medido en local: ~20 s.
      - name: Check kernel (leanchecker)
        run: lake env leanchecker FOL TheoryFramework

      # ⛔⛔ CORREGIDO el 2026-09-17. El comentario anterior decía, y con razón aparente:
      #   «`continue-on-error` MEDIDO: hoy `check-sorry.bash` sale con 1 en este árbol.
      #    Cuando el árbol quede a cero, cambiar a `false`.»
      # La salida era cierta; la INFERENCIA, falsa. El árbol YA estaba a cero: lo que salía
      # con 1 era el CONTROL. Contaba `grep -c 'sorry'` a secas, y los dos «sorry» que
      # reportaba eran la frase «100 % sorry-free» dentro de un COMENTARIO
      # (TheoryFramework/Instances/FOL.lean:34 y TheoryFramework/Logic.lean:58).
      # ⇒ se portó el control de ROBINSON_PlusPlus, que despoja comentarios y literales antes
      # de buscar el TOKEN, y entonces da `✅ No sorry found.` con exit 0. MEDIDO.
      # 🔑 Cuando un control da rojo, hay DOS hipótesis — el árbol o el control —, y silenciar
      #    la puerta elige una sin comprobarla. La herramienta se arregla; la cifra nunca.
      - name: Check for sorry
        run: bash check-sorry.bash

      # ⭐ BLOQUEANTE, y medido: hoy sale con 0. Cuenta los `axiom` del árbol, comprueba que
      # AXIOMS.md los cita todos y que ninguna librería retirada ha vuelto al lakefile —
      # que es la enfermedad que dejó un `axiom` FALSO vivo 80 días en una librería
      # declarada y nunca compilada.
      # ⛔ 2026-10-03/04 (ADR-116 de RPP): ya no es un grep. Cuenta en el ENTORNO de Lean (`lake env
      # lean`, tras el build de arriba) cada `axiomInfo` de FOL y de TheoryFramework, y también toda
      # constante cuyo tipo o valor nombra `sorryAx`; el grep sin comentarios queda como contraste.
      - name: Check axioms
        run: bash check-axioms.bash

      # ⭐⭐ ADOPTADO el 2026-09-17 (ADR-061 de ROBINSON_PlusPlus), y BLOQUEANTE desde el
      # primer día. Es el control que RPP lleva meses usando; portarlo a FOL no fue
      # burocracia: en su PRIMERA ejecución encontró TRES desfases de cifras vivos desde
      # mayo de 2026 («1 sorry (eq/Henkin)» en dos árboles de directorios y
      # «✅ Complete (1 sorry pendiente)» en la tabla de fases) y los SEIS módulos de
      # `TheoryFramework/` sin proyectar en REFERENCE.md — de los cuales CUATRO quedaban
      # absueltos por SUBCADENA con el matcher que traía RPP.
      # No ejecuta `lake build` (lo hace el paso «Build» de arriba); la cifra de jobs
      # la mide y la publica ROBINSON_PlusPlus.
      # ⚠️ [B] mira el repo hermano por si los docs de FOL citan símbolos VIVOS de RPP con sus
      # prefijos; medido el 2026‑10‑02, hoy no hay ninguno (los cuatro `ax_` citados están
      # retirados), y el clon entero sólo hace pasar por vivo a `ax_list_induction` vía
      # `sondeos/`. Un control con el alcance equivocado no comprueba: INVENTA.
      # ⛔ `actions/checkout` no admite un `path:` fuera del workspace, así que RPP se clona
      # DENTRO (`_rpp`) y el script lo recibe por `RPP_DIR`. Si el checkout falla, el control
      # sigue: detecta que no está y lo anuncia como **alcance REDUCIDO** en vez de callarse.
      # 🔑 Un control tiene TRES resultados — pasa, falla, no he podido comprobarlo — y el
      #    tercero se dice.
      - name: Checkout ROBINSON_PlusPlus (hermano, sólo para el bloque [B])
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: julian1c2a/ROBINSON_PlusPlus
          path: _rpp
          fetch-depth: 0
        continue-on-error: true

      # ⭐ El mismo certificado que en RPP (ADR-073). Aqui el hermano solo alimenta el bloque
      # [B], pero el principio es el mismo: si el control mira otro repo, hay que decir CUAL.
      # ⚠️ `|| true`: el checkout lleva `continue-on-error`, asi que puede no existir, y este
      # paso no debe convertir un alcance REDUCIDO en un fallo.
      - name: Certificar el par (FOL@sha, RPP@sha)
        run: |
          {
            echo "### Par certificado"
            echo ""
            echo "| repo | sha |"
            echo "|---|---|"
            echo "| FOL | \`$(git rev-parse HEAD)\` |"
            echo "| ROBINSON_PlusPlus (\`_rpp\`) | \`$(git -C _rpp rev-parse HEAD 2>/dev/null || echo 'NO CLONADO — alcance REDUCIDO')\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # ⭐ 2026-10-28 (T38 y T16, ADR-202 de RPP): FOL y RPP, en el MISMO toolchain: un bump mueve el par a la vez. Si el
      # clon de RPP no está, el alcance es REDUCIDO y se dice (como en [B]). ✏️ El mismo día (R3-3-02 de la ronda 3,
      # ADR-212 de RPP): si difiere, AVISO, no rojo. Rojo aquí hacía imposible el bump con los dos master protegidos:
      # FOL va primero (M-12) y compararía con el master viejo de RPP. Lo certifica la CI de RPP, que va después.
      - name: El mismo toolchain en FOL y en RPP
        run: |
          if [ ! -f _rpp/lean-toolchain ]; then
            echo "⚠️  sin el clon de RPP: no se compara el toolchain (alcance REDUCIDO)"
          elif cmp -s <(tr -d '\r' < lean-toolchain) <(tr -d '\r' < _rpp/lean-toolchain); then
            echo "✓ el mismo toolchain: $(tr -d '\r' < lean-toolchain)"
          else
            echo "::warning::FOL en $(tr -d '\r' < lean-toolchain) y RPP en $(tr -d '\r' < _rpp/lean-toolchain): un bump mueve el par a la vez. Aquí es AVISO: rompe la comparación de la CI de RPP, que corre después (M-12)"
          fi

      # ⭐ 2026-10-19 (ADR-167 de RPP): el techo de la deuda de `[B]` es la tabla de la BASE VERIFICADA. En un push a una
      # rama `ci/…` (el flujo de RPP, que FOL adopta: la CI primero, master después), la base es `origin/master`, con su
      # nombre entero; en un push a master, el commit de ANTES del push; en un PR, su base. ✏️ Desde ADR-168 de RPP el
      # master de FOL está PROTEGIDO (sólo entra un commit con «lake build» en verde): la base siempre está verificada.
      - name: Check doc sync
        run: bash check-doc-sync.bash
        env:
          RPP_DIR: _rpp
          B_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/master' && github.event.before || '') }}

      # ⭐ 2026-10-28 (ADR-216 de RPP): la CADUCIDAD del token de RPP_DISPATCH_TOKEN, a la vista. El paso de abajo sólo
      # AVISA si no puede lanzar (a propósito: un master correcto no se pone rojo por un token), y un token caducado se
      # quedaría en un aviso que nadie lee. GitHub devuelve la fecha en la cabecera «github-authentication-token-expiration»
      # de cada respuesta a un token personal con caducidad: se imprime, va al resumen del run, y a menos de 30 días es
      # AVISO. Corre en todo push, también en las ramas `ci/…` (ven el secreto): se ve antes de llegar a master.
      - name: La caducidad del token de RPP
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.RPP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "sin el secreto RPP_DISPATCH_TOKEN: no hay caducidad que medir"
            exit 0
          fi
          # (`|| true`: sin la cabecera, el `grep` falla, y eso es un resultado, no un error del paso.)
          CAB=$(gh api -i rate_limit 2>/dev/null | tr -d '\r' | grep -i '^github-authentication-token-expiration:' | cut -d: -f2- | sed 's/^ *//' || true)
          if [ -z "$CAB" ]; then
            echo "::warning::no pude leer la caducidad del token de RPP_DISPATCH_TOKEN (la respuesta no trae la cabecera: ¿caducado, revocado o sin fecha?)"
            exit 0
          fi
          FIN=$(date -u -d "$CAB" +%s) || { echo "::warning::la caducidad del token de RPP_DISPATCH_TOKEN, ilegible: «$CAB»"; exit 0; }
          DIAS=$(( (FIN - $(date -u +%s)) / 86400 ))
          echo "el token de RPP_DISPATCH_TOKEN caduca el $CAB (quedan $DIAS días)"
          printf '\n### El token de RPP_DISPATCH_TOKEN\n\ncaduca el **%s** (quedan %s días)\n' "$CAB" "$DIAS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DIAS" -lt 30 ]; then
            echo "::warning::el token de RPP_DISPATCH_TOKEN caduca el $CAB (quedan $DIAS días): renuévalo (Settings → Developer settings → Fine-grained tokens) o la CI de RPP dejará de lanzarse desde aquí"
          fi

      # ⭐ 2026-10-28 (T38; ADR-207 de RPP): un push a master de FOL, ya en verde, lanza la CI de RPP, que construye contra
      # el master de FOL (ADR-073); hasta hoy, una regresión de FOL la veía la cruzada diaria de RPP, o su push siguiente.
      # Pide un token de grano fino del propietario con «Actions: Read and write» SÓLO sobre ROBINSON_PlusPlus, en el
      # secreto RPP_DISPATCH_TOKEN (workflow_dispatch, no repository_dispatch: éste pediría «Contents: write», que deja
      # subir código). Sin el secreto, lo DICE y no hace nada: un control tiene tres resultados.
      - name: Lanzar la CI de RPP contra este master de FOL
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.RPP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::sin el secreto RPP_DISPATCH_TOKEN: la CI de RPP no se lanza desde aquí (la cubre su cruzada diaria)"
            exit 0
          fi
          # ✏️ 2026-10-28 (ADR-212 de RPP): si no se puede lanzar, AVISO y no rojo: el master de FOL está bien aunque el
          # token no alcance (el primer intento dio «HTTP 403: Resource not accessible by personal access token» y dejó
          # rojo un master correcto). La cruzada diaria de RPP lo sigue cubriendo.
          if gh workflow run build.yml -R julian1c2a/ROBINSON_PlusPlus --ref master; then
            echo "✓ lanzada la CI de RPP contra el master de FOL $GITHUB_SHA"
          else
            echo "::warning::no pude lanzar la CI de RPP: ¿el token de RPP_DISPATCH_TOKEN tiene «Actions: Read and write» SOBRE ROBINSON_PlusPlus, y no ha caducado (el paso de la caducidad, arriba)?"
          fi
